version: "3.7"

services:
  oceand:
    container_name: oceand
    image: ghcr.io/vulpemventures/oceand:latest
    restart: unless-stopped
    environment:
      - OCEAN_LOG_LEVEL=4
      - OCEAN_NO_TLS=true
      - OCEAN_STATS_INTERVAL=120
      - OCEAN_NODE_RPC_ADDR=${NODE_RPC_ADDR}
      - OCEAN_NETWORK=${NETWORK}
      - OCEAN_UTXO_EXPIRY_DURATION_IN_SECONDS=240
    ports:
      - "18000:18000"
      - "18001:18001"
    volumes:
      - ./oceand/data:/home/ocean/.ocean-wallet
      - ./oceand/cli:/home/ocean/.ocean-cli
  taxid:
    container_name: taxid
    image: ghcr.io/vulpemventures/taxid:latest
    restart: unless-stopped
    depends_on:
      - oceand
      - db
    environment:
      - TAXI_DOMAIN=${DOMAIN}
      - TAXI_EMAIL=${EMAIL}
      - TAXI_EXTERNAL_URL=${EXTERNAL_URL}
      - TAXI_DB_USER=${DB_USER}
      - TAXI_DB_PASSWORD=${DB_PASSWORD}
      - TAXI_DB_NAME=${DB_NAME}
      - TAXI_DB_HOST=taxid_db
      - TAXI_DB_PORT=5432
      - TAXI_OCEAN_ADDRESS=oceand:18000
      - TAXI_LOG_LEVEL=5
    ports:
      - "8000:8000"
    volumes:
      - ./taxid/data:/home/taxi/.taxid
      - ./taxid/cli:/home/taxi/.taxi-admin-cli
      - ./taxid/certs:/.certmagic
  db:
    container_name: taxid-db
    image: postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "5432:5432"
