version: "3.7"

services:
  taxid:
    container_name: "taxid"
    image: ghcr.io/vulpemventures/taxid:latest
    restart: unless-stopped
    environment:
      - TAXI_DOMAIN=${DOMAIN}
      - TAXI_EMAIL=${EMAIL}
      - TAXI_MNEMONIC=${MNEMONIC}
      - TAXI_LOG_LEVEL=5
    ports:
      - "443:443"
      - "7000:7000"
    volumes:
      - ./data:/home/taxi
