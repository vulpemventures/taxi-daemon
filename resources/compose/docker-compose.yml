version: "3.7"

services:
  oceand:
    container_name: oceand
    image: ghcr.io/vulpemventures/oceand:v0.1.0-rc.9
    restart: unless-stopped
    environment:
      - OCEAN_LOG_LEVEL=4
      - OCEAN_NO_TLS=true
      - OCEAN_STATS_INTERVAL=120
      - OCEAN_NODE_PEERS=${NODE_PEERS}
      - OCEAN_NETWORK=${NETWORK}
      - OCEAN_UTXO_EXPIRY_DURATION_IN_SECONDS=240
    ports:
      - "18000:18000"
      - "18001:18001"
    volumes:
      - ./oceand/data:/.oceand
  taxid:
    container_name: taxid
    image: ghcr.io/vulpemventures/taxid:latest
    restart: unless-stopped
    depends_on:
      - oceand
    environment:
      - TAXI_DOMAIN=${DOMAIN}
      - TAXI_EMAIL=${EMAIL}
      - TAXI_EXTERNAL_URL=${EXTERNAL_URL}
      - TAXI_ADMIN_EXTERNAL_URL=${ADMIN_EXTERNAL_URL}
      - TAXI_OCEAN_ADDRESS=oceand:18000
      - TAXI_LOG_LEVEL=5
    ports:
      - "8000:8000"
      - "7000:7000"
    volumes:
      - ./taxid/data:/.taxid
      - ./taxid/certs:/.certmagic
