version: "3.7"

services:
  taxid:
    container_name: "taxid"
    image: ghcr.io/vulpemventures/taxid:latest
    restart: unless-stopped
    environment:
      - TAXI_DOMAIN=${DOMAIN}
      - TAXI_EMAIL=${EMAIL}
      - TAXI_MNEMONIC=${MNEMONIC}
      - TAXI_EXTERNAL_URL=${EXTERNAL_URL}
      - TAXI_ADMIN_EXTERNAL_URL=${ADMIN_EXTERNAL_URL}
      - TAXI_LOG_LEVEL=9
    ports:
      - "80:80"
      - "443:8000"
      - "7000:7000"
    volumes:
      - ./data:/.taxid
      - ./certs:/.certmagic
