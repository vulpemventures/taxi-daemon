#cloud-config

# Update/Upgrade, Reboot if required
package_update: true
package_upgrade: true
package_reboot_if_required: true

packages:
  # General security
  - unattended-upgrades
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg-agent
  - software-properties-common

# Disable root access
disable_root: true

# Set Locale
locale: en_US.UTF-8
timezone: Europe/Rome

# create the docker group
groups:
  - docker

users:
  - default
  - name: ${username}
    sudo: ALL=(ALL) NOPASSWD:ALL
    groups: users, admin, docker
    ssh_import_id: None
    lock_passwd: true
    ssh_authorized_keys:
      - "${sshkey}"
    shell: /bin/bash

write_files:
  # Enable ipv4 forwarding, required on CIS hardened machines
  - owner: root:root
    path: /etc/sysctl.d/99-enable-ipv4-forwarding.conf
    content: |
      net.ipv4.conf.all.forwarding=1
  # Disable PasswordAuthentication
  - owner: root:root
    path: /etc/ssh/sshd_config
    permissions: "0644"
    content: |
      # This file was inserted via cloud-init.yml
      # Authentication:
      PermitRootLogin no
      MaxAuthTries 2
      MaxSessions 3
      PasswordAuthentication no
      PermitEmptyPasswords no
      ChallengeResponseAuthentication no
      UsePAM yes
      AllowAgentForwarding no
      AllowTcpForwarding no
      X11Forwarding no
      PrintMotd no
      TCPKeepAlive no
      # override default of no subsystems
      Subsystem sftp	/usr/lib/openssh/sftp-server
      Protocol 2
      AllowUsers ${username}

cloud_config_modules:
  - runcmd

cloud_final_modules:
  - scripts-user

runcmd:
  # Install Docker, for production, consider pinning to stable versions
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg | apt-key add -
  - add-apt-repository "deb [arch=amd64] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable"
  - apt-get update -y
  - apt-get install -y docker-ce docker-ce-cli containerd.io
  # Install docker-compose
  - curl -L "https://github.com/docker/compose/releases/download/1.28.2/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
  - chmod a+x /usr/local/bin/docker-compose
  # Delete passwords
  - passwd -d root
  # Restart services
  - service ssh restart
  # Enable docker
  - systemctl start docker
  - systemctl enable docker
  # Finish
  - echo "Done."
  - touch /cloud-init-ran

final_message: "The system is up after $UPTIME seconds"
