version: "3.7"

services:
  oceand:
    container_name: oceand-regtest
    image: ghcr.io/vulpemventures/oceand:latest
    restart: unless-stopped
    environment:
      - OCEAN_LOG_LEVEL=5
      - OCEAN_NO_TLS=true
      - OCEAN_STATS_INTERVAL=120
      - OCEAN_NODE_RPC_ADDR=http://admin1:123@liquid:18884
      - OCEAN_NETWORK=regtest
      - OCEAN_ESPLORA_URL=http://chopsticks-liquid:3000
      - OCEAN_UTXO_EXPIRY_DURATION_IN_SECONDS=240
    ports:
      - "38000:18000"
      - "38001:18001"
    volumes:
      - ./oceand/data:/home/ocean/.ocean-wallet
      - ./oceand/cli:/home/ocean/.ocean-cli
  taxid:
    container_name: taxid-regtest
    build: 
      context: ../../
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - oceand
      - db
    environment:
      - TAXI_OCEAN_ADDRESS=oceand-regtest:18000
      - TAXI_LOG_LEVEL=5
      - TAXI_DB_USER=root
      - TAXI_DB_PASSWORD=secret
      - TAXI_DB_NAME=taxid-db
      - TAXI_DB_HOST=taxid-regtest-db
      - TAXI_DB_PORT=5432
    ports:
      - "8300:8000"
    volumes:
      - ./taxid/data:/home/taxi/.taxid
      - ./taxid/cli:/home/taxi/.taxi-admin-cli
  db:
    container_name: taxid-regtest-db
    image: postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=secret
    ports:
      - "5432:5432"

networks:
  default:
    name: nigiri
    external: true
