version: "3.7"

services:
  oceand:
    container_name: oceand-testnet
    image: ghcr.io/vulpemventures/oceand:latest
    restart: unless-stopped
    environment:
      - OCEAN_LOG_LEVEL=5
      - OCEAN_NO_TLS=true
      - OCEAN_NO_PROFILER=true
      - OCEAN_NODE_RPC_ADDR=http://admin1:123@liquid-testnet.sevenlabs.dev:18884
      - OCEAN_NETWORK=testnet
      - OCEAN_ESPLORA_URL=https://blockstream.info/liquidtestnet/api
      - OCEAN_UTXO_EXPIRY_DURATION_IN_SECONDS=240
    ports:
      - "28000:18000"
      - "28001:18001"
    volumes:
      - ./oceand/data:/home/ocean/.ocean-wallet
      - ./oceand/cli:/home/ocean/.ocean-cli
  taxid:
    container_name: taxid-testnet
    image: ghcr.io/vulpemventures/taxid:latest
    restart: unless-stopped
    depends_on:
      - oceand
      - db
    environment:
      - TAXI_DOMAIN=${TESTNET_DOMAIN}
      - TAXI_EMAIL=${TESTNET_EMAIL}
      - TAXI_EXTERNAL_URL=${TESTNET_EXTERNAL_URL}
      - TAXI_OCEAN_ADDRESS=oceand-testnet:28000
      - TAXI_LOG_LEVEL=5
      - TAXI_DB_USER=root
      - TAXI_DB_PASSWORD=secret
      - TAXI_DB_NAME=taxid-db
      - TAXI_DB_HOST=taxid-testnet-db
      - TAXI_DB_PORT=5432
    ports:
      - "8200:8000"
    volumes:
      - ./taxid/data:/home/taxi/.taxid
      - ./taxid/cli:/home/taxi/.taxi-admin-cli
      - ./taxid/certs:/.certmagic
  db:
    container_name: taxid-testnet-db
    image: postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=secret
    ports:
      - "5432:5432"
