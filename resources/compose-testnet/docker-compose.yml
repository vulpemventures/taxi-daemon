version: "3.7"

services:
  oceand:
    container_name: oceand-testnet
    image: ghcr.io/vulpemventures/oceand:latest
    restart: unless-stopped
    environment:
      - OCEAN_LOG_LEVEL=5
      - OCEAN_NO_TLS=true
      - OCEAN_NODE_PEERS="liquid-testnet.blockstream.com:18892"
      - OCEAN_NETWORK=testnet
      - OCEAN_UTXO_EXPIRY_DURATION_IN_SECONDS=240
    ports:
      - "28000:18000"
  taxid:
    container_name: taxid-testnet
    image: ghcr.io/vulpemventures/taxid:latest
    restart: unless-stopped
    depends_on:
      - oceand
    environment:
      - TAXI_DOMAIN=${TESTNET_DOMAIN}
      - TAXI_EMAIL=${TESTNET_EMAIL}
      - TAXI_EXTERNAL_URL=${TESTNET_EXTERNAL_URL}
      - TAXI_ADMIN_EXTERNAL_URL=${TESTNET_ADMIN_EXTERNAL_URL}
      - TAXI_OCEAN_ADDRESS=ocean:28000
      - TAXI_LOG_LEVEL=9
    ports:
      - "18000:8000"
      - "17000:7000"
    volumes:
      - ./taxid/data:/.taxid
      - ./taxid/certs:/.certmagic
