name: Go

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:

    - name: Install Nigiri
      run:  |
        mkdir -p nigiri-tmp; cd nigiri-tmp
        curl https://travis.nigiri.network | bash; cd ..
        docker-compose -f  nigiri-tmp/docker-compose.yml up -d
    
    - name: Run Mongo instance
      run: docker run -d --network host --name mongo-box mongo

    - name: Set up Go 1.14.x
      uses: actions/setup-go@v2
      with:
        go-version: ^1.14
      id: go

    - name: Check out code into the Go module directory
      uses: actions/checkout@v2

    - name: Get dependencies
      run: go get -v -t -d ./...

    - name: Format
      run: if [ -n "$(gofmt -l .)" ]; then echo "Go code is not formatted"; exit 1; fi

    - name: Test
      run: go test -count=1 -race ./... -v
