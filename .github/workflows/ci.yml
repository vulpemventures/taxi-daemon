name: Go

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  integration:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Go 1.17.x
        uses: actions/setup-go@v3
        with:
          go-version: 1.17.x

      - name: Run Nigiri
        uses: vulpemventures/nigiri-github-action@v1

      - name: Get dependencies
        run: go get -v -t -d ./...

      - name: Test
        run: make test
